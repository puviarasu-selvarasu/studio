[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studio"
version = "0.1.0"
description = "Local-first AI-assisted 2D animation production engine."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = [
    "studio_kernel/tests",
]
python_files = [
    "test_*.py",
]
addopts = "-ra"

[tool.setuptools]
py-modules = ["main"]