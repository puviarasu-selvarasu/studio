[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studio"
version = "0.1.0"
description = "Local-first AI-assisted animation production engine."
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.11,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = [
    "studio_kernel/tests",
    "tests",
]
python_files = [
    "test_*.py",
]
addopts = "-ra"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["studio_ui*"]